function analyzeVacancy(){const ta=document.getElementById('vacancyText'),text=(ta?.value||'').trim();if(!text){toast('Cole uma descrição de vaga primeiro.');return}state.vacancyLab.text=text;const n=normalizeText(text),terms=[];const candidates=[...D.vocab.filter(x=>x.category!=='Inglês essencial'),...D.expressions];candidates.forEach(x=>{const key=normalizeText(x.en);if(key.length>2&&n.includes(key)&&!terms.some(t=>normalizeText(t.en)===key))terms.push(x)});state.vacancyLab.lastTerms=terms.slice(0,40).map(x=>x.en);safeSave();renderCareer();setTimeout(()=>document.getElementById('vacancyLab')?.scrollIntoView({behavior:'smooth'}),30)}
function renderCareer(){const p=state.profile;const vacancyTerms=(state.vacancyLab.lastTerms||[]).map(en=>D.vocab.find(x=>x.en===en)||D.expressions.find(x=>x.en===en)).filter(Boolean);const story=[
 ['Quem eu sou',`I'm a ${p.role} with a long background in telecom, NOC, monitoring, networks and troubleshooting. I also build software to solve operational problems.`,'Use esta abertura para conectar sua carreira anterior com sua evolução para sistemas.'],
 ['Contexto atual',`My experience includes corporate videoconferencing environments, incident analysis, monitoring tools and coordination with technical teams until service normalization.`,'Mostre que você trabalha com ambiente real, disponibilidade e impacto.'],
 ['Projeto principal',`One project I'm proud of is a corporate videoconference observability system that I built with React and Node.js for ${p.company||'an enterprise environment'}.`,'Diga o que você construiu; não comece pela tecnologia.'],
 ['Problema',`Operational information was spread across different sources, which made incident history, recurring failures and troubleshooting evidence harder to analyze in one workflow.`,'Explique a dor antes da solução.'],
 ['Solução',`I designed a centralized web application for alarms, incidents, inventory, logs, evidence and operational indicators, with a frontend focused on the operator workflow.`,'Explique o comportamento do sistema e quem ele ajuda.'],
 ['Stack',`The frontend uses React-based components, while Node.js handles APIs, data processing and business logic. I also work with monitoring and operations tools such as Zabbix, Grafana and ServiceNow.`,'Conecte tecnologia à responsabilidade de cada camada.'],
 ['Meu diferencial',`My operational background helps me translate real incident workflows into system requirements, useful dashboards and automation opportunities.`,'Esse é um argumento forte para vaga de Analista de Sistemas.'],
 ['Troubleshooting',`I validate impact, collect evidence, correlate monitoring data and recent changes, rule out likely causes and escalate with clear technical context when another team is required.`,'Mostre método, não heroísmo.'],
 ['Próximo passo',`I want to keep growing in systems analysis, software architecture, APIs, automation and observability, using my operations background to build reliable solutions.`,'Mostre coerência de carreira.']
 ];app.innerHTML=`<section class="hero" style="grid-template-columns:1fr"><div><div class="terminal-label">$ build interview_story --role=systems_analyst --domain=observability</div><h2>Sua carreira precisa virar uma história técnica clara.</h2><p>O objetivo desta área é transformar sua experiência real em respostas que um RH e um entrevistador técnico consigam entender. Nada de decorar um texto gigante: <b>problema → raciocínio → ação → tecnologia → impacto</b>.</p><div class="hero-actions"><button class="primary" onclick="navigate('technical')">TREINAR ENTREVISTA TÉCNICA</button><button class="secondary" onclick="navigate('interview')">TREINAR COM RH</button><button class="ghost" onclick="applyFlaviaCareerPreset()">APLICAR MEU PRESET PROFISSIONAL</button></div></div></section><div class="section-title"><div><h2>Mapa da sua experiência</h2><p>Os pontos que devem aparecer naturalmente em entrevistas de Systems Analyst.</p></div></div><div class="career-map"><div class="career-evidence"><h4>20+ anos de operação e telecom</h4><p>NOC, redes, monitoramento, disponibilidade, suporte e troubleshooting em ambientes críticos.</p></div><div class="career-evidence"><h4>Operação de videoconferência</h4><p>Análise de equipamentos, conectividade, alarmes, incidentes, logs, latência, perda de pacotes e escalonamento.</p></div><div class="career-evidence"><h4>Observabilidade e monitoração</h4><p>Zabbix, Grafana, Broadcom, inventário, alarmes, reincidência, evidências e indicadores operacionais.</p></div><div class="career-evidence"><h4>Desenvolvimento aplicado à operação</h4><p>React, Node.js e Next.js usados para transformar necessidades reais da operação em dashboards, fluxos e automações.</p></div></div><div class="section-title"><div><h2>Arquitetura que você precisa saber explicar</h2><p>Não basta dizer “usei React e Node”. Explique a responsabilidade de cada parte.</p></div></div><div class="project-architecture"><div class="arch-node"><b>Fontes operacionais</b><small>Alarmes, inventário, logs, chamados, métricas e evidências.</small></div><div class="arch-node"><b>Backend · Node.js</b><small>APIs, normalização, regras de negócio, processamento e integrações.</small></div><div class="arch-node"><b>Frontend · React</b><small>Dashboards, filtros, componentes, fluxos de análise e visão operacional.</small></div><div class="arch-node"><b>Decisão operacional</b><small>Priorizar, investigar reincidência, documentar evidência e apoiar troubleshooting.</small></div></div><div class="section-title"><div><h2>Career Story · respostas progressivas</h2><p>Ouça, entenda e depois fale sem ler.</p></div></div><div class="career-story">${story.map(([t,s,tip],i)=>`<div class="story-card"><span class="pill">${String(i+1).padStart(2,'0')}</span><h4>${h(t)}</h4><div class="story-line">${h(s)}</div><small style="color:var(--muted);display:block;margin:8px 0">${h(tip)}</small><button class="mini" onclick="speak('${h(s).replace(/'/g,"\\'")}',.74)">▶ OUVIR</button><button class="mini" onclick="speak('${h(s).replace(/'/g,"\\'")}',.42)">🐌 MUITO DEVAGAR</button><button class="ghost" onclick="startCareerRecognition(${i})">🎙 FALAR</button><div id="careerRec${i}" class="speak-result">Pratique em voz alta.</div></div>`).join('')}</div><details class="profile-panel" style="margin-top:14px"><summary>Aprofundar meu perfil para respostas personalizadas</summary><div class="profile-grid"><div class="profile-field"><label>Background profissional</label><textarea id="career_background" rows="3">${h(p.background||'')}</textarea></div><div class="profile-field"><label>Pontos fortes</label><textarea id="career_strengths" rows="3">${h(p.strengths||'')}</textarea></div><div class="profile-field"><label>Ferramentas / tecnologias</label><textarea id="career_tools" rows="3">${h(p.tools||'')}</textarea></div><div style="display:flex;align-items:end"><button class="primary" onclick="saveCareerDeepProfile()">SALVAR</button></div></div></details><div id="vacancyLab" class="card" style="margin-top:14px"><span class="pill">VAGA LAB · LOCAL</span><h3>Cole uma vaga e descubra o vocabulário técnico que ela exige</h3><p>O analisador procura termos já existentes no banco do curso. Ele não envia o texto para nenhum servidor.</p><textarea id="vacancyText" rows="6" style="width:100%" placeholder="Cole aqui a descrição da vaga...">${h(state.vacancyLab.text||'')}</textarea><button class="primary" style="margin-top:8px" onclick="analyzeVacancy()">ANALISAR VOCABULÁRIO DA VAGA</button>${vacancyTerms.length?`<div class="vacancy-result">${vacancyTerms.slice(0,30).map(x=>`<div class="vacancy-term"><b>${h(x.en)}</b><span>${h(x.pt||x.category||'')}</span></div>`).join('')}</div>`:''}</div>`}

</span><h3>Alex + Emma</h3><p>RH Virtual e entrevista técnica em trilhas separadas.</p><button class="secondary" onclick="navigate('technical')">ABRIR</button></div></div><div class="skill-grid" style="margin-top:13px">${Object.keys(skillMeta).map(levelCard).join('')}</div>`;updateProgress()}
