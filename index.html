}.track-card{position:relative;min-height:170px}.track-icon{font:800 12px ui-monospace,SFMono-Regular,monospace;color:var(--cyan);border:1px solid #20495d;display:inline-grid;place-items:center;min-width:42px;height:30px;padding:0 8px;border-radius:8px;background:#071a26}.track-card small{display:block;color:#586e86;margin:14px 0 10px;font-size:9px;letter-spacing:.08em}.section-title{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:26px 0 10px}.section-title h2{margin:0;font-size:18px}.section-title p{margin:3px 0 0;color:var(--muted);font-size:11px}.notice{border:1px solid #2c483f;background:linear-gradient(90deg,#0a211d,#0a1821);color:#9bd7c1;border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.55}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.search,.select,textarea{border:1px solid var(--line);background:#081421;color:#d8e5f1;border-radius:10px;padding:10px 12px;outline:none}.search:focus,.select:focus,textarea:focus{border-color:#2e7186;box-shadow:0 0 0 3px rgba(56,217,255,.07)}.search{flex:1;min-width:230px}.select option{background:#081421}.vocab-list,.expression-list,.phrase-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.vocab-row,.expression-row,.phrase-row{border:1px solid var(--line);background:#091522;border-radius:13px;padding:13px;display:flex;justify-content:space-between;align-items:center;gap:12px;transition:.18s}.vocab-row:hover,.expression-row:hover,.phrase-row:hover{border-color:#285069;background:#0b1a2a;transform:translateY(-1px)}.word h4,.expression-row h4,.phrase-row h4{margin:0 0 4px;font-size:15px}.word small,.expression-row small,.phrase-row small{color:#7f94aa}.example-line{margin-top:8px;color:#a6bacd;font-size:11px;line-height:1.45;border-left:2px solid #24465a;padding-left:8px}.tag,.pill{display:inline-flex;align-items:center;border:1px solid #233b51;border-radius:99px;background:#0d1d2d;color:#7590aa;padding:3px 7px;font-size:8px;text-transform:uppercas /* Guided onboarding / clarity layer */
.start-shell{max-width:980px;margin:0 auto}.start-hero{border:1px solid #23506a;background:radial-gradient(circle at 85% 0,rgba(56,217,255,.16),transparent 34%),linear-gradient(145deg,#0b1b2b,#07131f);border-radius:20px;padding:28px;box-shadow:var(--shadow)}.start-hero h2{font-size:34px;line-height:1.08;margin:10px 0}.start-hero p{color:#a9bfd2;max-width:760px;line-height:1.65}.guided-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.guided-step{border:1px solid var(--line);background:#081522;border-radius:15px;padding:16px;position:relative}.guided-step.current{border-color:#2d718e;background:linear-gradient(145deg,#0b2130,#081522);box-shadow:inset 0 0 0 1px rgba(56,217,255,.08)}.guided-step.done{border-color:#285c43;background:#091b16}.guided-step .step-no{font:800 11px ui-monospace,SFMono-Regular,monospace;color:var(--cyan);letter-spacing:.08em}.guided-step.done .step-no{color:var(--green)}.guided-step h3{margin:8px 0 5px;font-size:16px}.guided-step p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.what-now{border:1px solid #2c5c73;background:linear-gradient(110deg,rgba(56,217,255,.09),rgba(108,255,155,.05));border-radius:16px;padding:18px;margin-top:14px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.what-now h3{margin:3px 0 5px;font-size:20px}.what-now p{margin:0;color:#9bb1c5;line-height:1.55}.simple-rule{display:flex;gap:10px;align-items:flex-start;border:1px solid #203a4c;background:#07131f;border-radius:12px;padding:12px;margin:12px 0}.simple-rule .rule-icon{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:#0b2634;color:var(--cyan);font-weight:900;flex:0 0 auto}.simple-rule b{display:block;margin-bottom:2px}.simple-rule small{color:var(--muted);line-height:1.45}.instruction-box{border:1px solid #2a4b61;background:#081827;border-radius:14px;padding:15px;margin-bottom:14px}.instruction-box h3{margin:0 0 8px;font-size:15px}.instruction-box ol{margin:0;padding-left:20px;color:#b9cad9;line-height:1.7;font-size:12px}.instruction-box .important{color:var(--amber);font-weight:700}.next-task-card{border:1px solid #2a657e;background:radial-gradient(circle at 100% 0,rgba(56,217,255,.11),transparent 30%),#081827;border-radius:16px;padding:18px;margin-bottom:13px}.next-task-card .big-step{font:900 12px ui-monospace,SFMono-Regular,monospace;color:var(--cyan);letter-spacing:.1em}.next-task-card h2{margin:7px 0;font-size:25px}.next-task-card p{color:#9fb4c7;line-height:1.6}.library-note{border:1px dashed #294054;border-radius:12px;padding:12px;color:#8499ad;font-size:11px;line-height:1.55}.mission-item .mini:first-child{background:#0b2a3b;border-color:#28718d;color:#bfefff;font-weight:800}.plain-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.help-chip{display:inline-flex;padding:5px 8px;border:1px solid #27526a;border-radius:99px;background:#081b28;color:#8cdff4;font-size:10px;font-weight:700}

}, {"id": 1468, "en": "turn off", "pt": "desligar", "category": "Chunks e phrasal verbs"}, {"id": 1469, "en": "plug in", "pt": "conectar", "category": "Chunks e phrasal verbs"}, {"id": 1470, "en": "unplug", "pt": "desconectar", "category": "Chunks e phrasal verbs"}, {"id": 1471, "en": "sign in", "pt": "entrar", "category": "Chunks e phrasal verbs"}, {"id": 1472, "en": "sign out", "pt": "sair", "category": "Chunks e phrasal verbs"}, {"id": 1473, "en": "opt in", "pt": "aderir", "category": "Chunks e phrasal verbs"}, {"id": 1474, "en": "opt out", "pt": "não aderir", "category": "Chunks e phrasal verbs"}, {"id": 1475, "en": "spin up", "pt": "criar rapidamente um recurso", "category": "Chunks e phrasal verbs"}, {"id": 1476, "en": "tear down", "pt": "desmontar; remover recurso", "category": "Chunks e phrasal verbs"}, {"id": 1477, "en": "warm up", "pt": "aquecer; preparar", "category": "Chunks e phrasal verbs"}, {"id": 1478, "en": "cool down", "pt": "reduzir atividade", "category": "Chunks e phrasal verbs"}, {"id": 1479, "en": "fall back to", "pt": "recorrer a alternativa", "category": "Chunks e phrasal verbs"}, {"id": 1480, "en": "phase out", "pt": "descontinuar gradualmente", "category": "Chunks e phrasal verbs"}, {"id": 1481, "en": "roll out", "pt": "lançar gradualmente", "category": "Chunks e phrasal verbs"}, {"id": 1482, "en": "ship a feature", "pt": "entregar uma funcionalidade", "category": "Chunks e phrasal verbs"}, {"id": 1483, "en": "push a fix", "pt": "enviar uma correção", "category": "Chunks e phrasal verbs"}, {"id": 1484, "en": "open a ticket", "pt": "abrir um chamado", "category": "Chunks e phrasal verbs"}, {"id": 1485, "en": "close a ticket", "pt": "fechar um chamado", "category": "Chunks e phrasal verbs"}, {"id": 1486, "en": "raise an issue", "pt": "levantar um problema", "category": "Chunks e phrasal verbs"}, {"id": 1487, "en": "resolve an incident", "pt": "resolver um incidente", "category": "Chunks e phrasal verbs"}, {"id": 1488, "en": "meet a deadline", "pt": "cumprir um prazo", "category": "Chunks e phrasal verbs"}, {"id": 1489, "en": "miss a deadline", "pt": "perder um prazo", "category": "Chunks e phrasal verbs"}, {"id": 1490, "en": "make a decision", "pt": "tomar uma decisão", "category": "Chunks e phrasal verbs"}, {"id": 1491, "en": "take ownership", "pt": "assumir responsabilidade", "category": "Chunks e phrasal verbs"}, {"id": 1492, "en": "share feedback", "pt": "compartilhar feedback", "category": "Chunks e phrasal verbs"}, {"id": 1493, "en": "ask for clarification", "pt": "pedir esclarecimento", "category": "Chunks e phrasal verbs"}], "grammar": [{"title": "1. Estrutura da frase", "level": "Base", "rule": "O padrão mais comum é Subject + Verb + Object/Complement. O inglês depende bastante da ordem das palavras.", "examples": ["I work with technology.", "The application stores user data.", "The server is online."]}, {"title": "2. Pronomes pessoais", "level": "Base", "rule": "I, you, he, she, it, we, they funcionam como sujeitos. Em inglês, normalmente o sujeito precisa aparecer.", "examples": ["I am learning English.", "It is working.", "They are developers."]}, {"title": "3. Verb to be", "level": "Base", "rule": "Presente: am/is/are. Passado: was/were. Use para identidade, estado, localização e como auxiliar em tempos contínuos.", "examples": ["I am a developer.", "The server is down.", "The users are connected."]}, {"title": "4. Artigos: a, an, the", "level": "Base", "rule": "A/an introduzem algo não específico. The aponta para algo específico ou já conhecido.", "examples": ["I need a server.", "This is an error.", "The server is unavailable."]}, {"title": "5. Present Simple", "level": "Base", "rule": "Use para fatos, hábitos, rotinas e funcionamento normal. Na 3ª pessoa, o verbo geralmente recebe -s.", "examples": ["The API returns JSON.", "She works with React.", "The system stores data."]}, {"title": "6. Do / Does", "level": "Base", "rule": "Auxiliares para perguntas e negativas no Present Simple.", "examples": ["Do you work remotely?", "Does the API require authentication?", "I do not know."]}, {"title": "7. Present Continuous", "level": "Base", "rule": "am/is/are + verb-ing. Use para algo acontecendo agora ou em andamento.", "examples": ["I am debugging the application.", "We are investigating the issue.", "The server is restarting."]}, {"title": "8. Past Simple", "level": "Intermediário", "rule": "Use para eventos concluídos no passado. Verbos regulares usam -ed; irregulares mudam a forma.", "examples": ["The server crashed yesterday.", "I fixed the bug.", "We found the root cause."]}, {"title": "9. Did", "level": "Intermediário", "rule": "Auxiliar de perguntas e negativas no Past Simple. O verbo principal volta à forma base.", "examples": ["Did you check the logs?", "I did not change the configuration.", "Did the deployment fail?"]}, {"title": "10. Present Perfect", "level": "Intermediário", "rule": "have/has + past participle. Liga passado e presente: experiência, resultado atual ou evento recente sem tempo passado fechado.", "examples": ["We have identified the root cause.", "I have worked with React.", "The server has stopped responding."]}, {"title": "11. Present Perfect Continuous", "level": "Intermediário", "rule": "have/has been + verb-ing. Ação iniciada antes e ainda em andamento ou recentemente em andamento.", "examples": ["I have been working on this feature all week.", "We have been monitoring the server."]}, {"title": "12. Future: will", "level": "Intermediário", "rule": "will + verbo base para decisões, previsões e promessas.", "examples": ["We will deploy the fix tonight.", "I will check the logs."]}, {"title": "13. Going to", "level": "Intermediário", "rule": "am/is/are going to + verbo para planos e intenções já definidos.", "examples": ["We are going to migrate the database.", "I am going to practice interviews."]}, {"title": "14. Modal verbs", "level": "Intermediário", "rule": "can, could, should, would, may, might, must + verbo base. Expressam capacidade, hipótese, conselho, obrigação e cortesia.", "examples": ["This could be a network issue.", "We should refactor this code.", "Passwords must be encrypted."]}, {"title": "15. Comparativos", "level": "Intermediário", "rule": "Compare soluções com -er/more e than.", "examples": ["This approach is faster than the old one.", "PostgreSQL is more suitable for this use case."]}, {"title": "16. Conditionals", "level": "Intermediário", "rule": "If cria condições. Zero: fato. First: possibilidade real. Second: hipótese. Third: hipótese sobre o passado.", "examples": ["If the token expires, the user is logged out.", "If the deployment fails, we will roll back.", "If I had more time, I would add tests."]}, {"title": "17. Passive Voice", "level": "Intermediário", "rule": "be + past participle. Muito comum em documentação técnica quando o processo importa mais que quem executa.", "examples": ["The data is encrypted.", "The application was deployed yesterday.", "Requests are validated before processing."]}, {"title": "18. Relative clauses", "level": "Avançando", "rule": "who, that, which, where conectam informações sobre pessoas e coisas.", "examples": ["The service that handles authentication is down.", "The engineer who fixed the issue is on my team."]}, {"title": "19. Gerund e infinitive", "level": "Avançando", "rule": "Alguns verbos pedem verb-ing; outros, to + verbo.", "examples": ["I enjoy solving problems.", "We need to improve performance.", "I decided to refactor the module."]}, {"title": "20. Connectors", "level": "Avançando", "rule": "Use because, although, however, therefore, while, since, so that para conectar raciocínio profissional.", "examples": ["The deployment failed because a dependency was missing.", "The API is fast; however, it is not resilient."]}, {"title": "21. Reported speech", "level": "Avançando", "rule": "Use para relatar o que alguém disse ou informou.", "examples": ["The user said that the application was slow.", "The manager asked whether the fix was ready."]}, {"title": "22. Perguntas indiretas", "level": "Avançando", "rule": "Mais naturais e educadas em ambiente profissional. Após a abertura, use ordem afirmativa.", "examples": ["Could you tell me what happened?", "Do you know where the logs are stored?"]}, {"title": "23. Should have / could have", "level": "Avançando", "rule": "modal + have + particípio para avaliar possibilidades e decisões passadas.", "examples": ["We should have tested this before deployment.", "The outage could have been prevented."]}, {"title": "24. Hedging profissional", "level": "Avançando", "rule": "Use seems, appears, might, could, likely para não afirmar como certeza algo ainda não comprovado.", "examples": ["The issue seems to be related to the database.", "This might be caused by a timeout."]}], "readings": [{"title": "Como uma requisição web funciona", "level": "A2-B1", "text": "When a user opens a web application, the browser sends a request to a server. The server processes the request and may query a database. After the data is retrieved, the server sends a response back to the browser. The browser then renders the interface for the user.", "questions": ["What sends the request?", "What may the server query?", "What does the browser do after receiving the response?"]}, {"title": "Investigando um incidente", "level": "B1", "text": "During a production incident, the first goal is to understand the impact. Engineers check monitoring dashboards, logs, alerts, and recent deployments. They try to reproduce the issue and identify the root cause. If a recent release caused the problem, the team may roll back the deployment while a permanent fix is prepared.", "questions": ["What is the first goal during an incident?", "What sources do engineers check?", "When may the team roll back?"]}, {"title": "Autenticação e autorização", "level": "B1", "text": "Authentication verifies who a user is, while authorization determines what that user is allowed to do. A system may authenticate a user with a password, token, or multi-factor authentication. After authentication, roles and permissions can be used to control access to resources.", "questions": ["What is the difference between authentication and authorization?", "Name two authentication methods.", "What can control access after authentication?"]}, {"title": "SaaS multi-tenant", "level": "B1-B2", "text": "In a multi-tenant SaaS application, multiple customers use the same platform while their data remains isolated. Each customer may have different users, roles, subscription plans, and settings. Good tenant isolation is critical because one customer must never be able to access another customer’s private data.", "questions": ["What does multi-tenant mean?", "What may differ between customers?", "Why is tenant isolation critical?"]}, {"title": "Escalabilidade", "level": "B2", "text": "Scalability is the ability of a system to handle increasing workloads without unacceptable performance degradation. Teams may scale vertically by adding more resources to a machine or horizontally by adding more instances. The right strategy depends on architecture, cost, traffic patterns, and operational complexity.", "questions": ["What is scalability?", "What is vertical scaling?", "What factors influence the scaling strategy?"]}, {"title": "Revisão de código", "level": "B2", "text": "A good code review is not only about finding bugs. Reviewers also evaluate readability, maintainability, security, test coverage, and whether the implementation matches the requirement. Strong teams discuss trade-offs respectfully and avoid treating suggestions as personal criticism.", "questions": ["What does a code review evaluate besides bugs?", "How should teams discuss trade-offs?"]}], "interviews": [{"q": "Tell me about yourself.", "focus": "Apresentação profissional", "template": "I am a [role] with experience in [areas]. In my current/recent work, I am responsible for [responsibilities]. I have been focusing on [skills/projects], and I am looking for an opportunity where I can [goal]."}, {"q": "Can you walk me through your experience?", "focus": "Trajetória", "template": "I started my career in [area]. Over time, I worked with [technologies/responsibilities]. More recently, I have been focusing on [current direction]. One project I am particularly proud of is [project], where I [impact]."}, {"q": "What technologies have you worked with?", "focus": "Stack", "template": "I have worked with [stack]. I am most comfortable with [strong areas], and I also have hands-on experience with [other tools]."}, {"q": "Tell me about a challenging problem you solved.", "focus": "STAR", "template": "The situation was [context]. My task was [responsibility]. I first [action], then [action]. As a result, [measurable/result]. The main thing I learned was [lesson]."}, {"q": "How do you troubleshoot a production issue?", "focus": "Troubleshooting", "template": "First, I confirm the impact and gather evidence. Then I check monitoring, logs, recent changes, and dependencies. I try to reproduce the issue, form hypotheses, and test them. If needed, I apply a safe workaround or rollback, then document the root cause and permanent fix."}, {"q": "What is the difference between authentication and authorization?", "focus": "Conceito técnico", "template": "Authentication answers “Who are you?”, while authorization answers “What are you allowed to do?”. Authentication verifies identity; authorization checks permissions."}, {"q": "What happens when you enter a URL in the browser?", "focus": "Web fundamentals", "template": "The browser resolves the domain through DNS, establishes a network connection, sends an HTTP request, receives a response, and then parses and renders the page. Additional resources may trigger more requests."}, {"q": "How does an API work?", "focus": "API", "template": "An API exposes a contract that allows one system to communicate with another. A client sends a request to an endpoint with parameters or a payload, and the server processes it and returns a response with a status code and data."}, {"q": "How would you improve application performance?", "focus": "Performance", "template": "I would measure first. I would identify the bottleneck using metrics and profiling, then optimize the relevant layer—database queries, caching, network calls, rendering, or infrastructure—and verify the improvement with the same measurements."}, {"q": "Why do you want this role?", "focus": "Motivação", "template": "This role matches my experience in [area] and the direction I want to grow in. I am especially interested in [product/technology/challenge], and I believe I can contribute with [strength]."}, {"q": "What are your strengths?", "focus": "Comportamental", "template": "One of my strengths is [strength]. For example, in [situation], I [behavior], which resulted in [result]."}, {"q": "What is a weakness you are working on?", "focus": "Comportamental", "template": "One area I am improving is [real but manageable weakness]. I have been working on it by [specific actions], and I have already noticed [progress]."}, {"q": "How do you prioritize tasks?", "focus": "Organização", "template": "I consider impact, urgency, dependencies, risk, and deadlines. I clarify priorities with stakeholders when needed and keep the team updated if trade-offs change."}, {"q": "How do you handle disagreement in a code review?", "focus": "Colaboração", "template": "I focus on the technical trade-off rather than the person. I explain my reasoning, ask questions, consider evidence and team standards, and align on the option that best serves the product and maintainability."}, {"q": "What do you do when you do not know the answer?", "focus": "Maturidade", "template": "I say what I know, clarify what I am unsure about, and explain how I would find the answer. In technical work, I prefer a transparent investigation to guessing."}], "listening": [{"kind": "Vídeo", "level": "Fase 1 — fala clara", "title": "BBC Learning English — Technology 3 (6 Minute English)", "url": "https://www.youtube.com/watch?v=mzymjYVkS3w", "why": "Vocabulário de tecnologia com fala didática, episódios curtos e contexto."}, {"kind": "Vídeo", "level": "Fase 1 — fala clara", "title": "BBC Learning English — Internet and Technology mega-class", "url": "https://www.youtube.com/watch?v=rnBQXmO_StE", "why": "Uma hora de listening com tecnologia, vocabulário e explicações."}, {"kind": "Vídeo", "level": "Fase 2 — entrevista", "title": "English Speaking in IT Interviews", "url": "https://www.youtube.com/watch?v=q20qq_pQ2lE", "why": "Treino de comunicação e vocabulário usado em entrevistas de TI."}, {"kind": "Vídeo", "level": "Fase 3 — entrevista técnica real", "title": "Front End Mock Technical Interview", "url": "https://www.youtube.com/watch?v=vomuCMmoNyE", "why": "Entrevista técnica realista com JavaScript, CSS, React e algoritmos."}, {"kind": "Podcast", "level": "Fase 2 — intermediário", "title": "Syntax.fm", "url": "https://syntax.fm/", "why": "Conversas naturais sobre JavaScript, React, CSS, Node, bancos e web. Bom para aprender como devs realmente falam."}, {"kind": "Podcast", "level": "Fase 2 — intermediário", "title": "The Changelog", "url": "https://changelog.com/podcast", "why": "Entrevistas de engenharia e open source; fala geralmente mais deliberada."}, {"kind": "Podcast", "level": "Fase 3 — intermediário/avançado", "title": "Darknet Diaries", "url": "https://darknetdiaries.com/", "why": "Histórias de segurança e redes com narrativa muito clara e envolvente."}, {"kind": "Podcast", "level": "Fase 4 — avançado", "title": "Software Engineering Daily", "url": "https://softwareengineeringdaily.com/", "why": "Conteúdo técnico denso sobre cloud, sistemas distribuídos, dados e IA."}, {"kind": "Podcast", "level": "Fase 3 — carreira e comunicação", "title": "Beyond Coding", "url": "https://www.youtube.com/playlist?list=PLX6ivsCcfHDOzMIUioOofyF-h-niZL6Qj", "why": "Engenharia, carreira, li , "category": "SaaS & product", "level": "B1-B2", "en": "The dashboard shows the most important business metrics.", "pt": "O dashboard mostra as métricas de negócio mais importantes."}, {"id": 163, "category": "Interview", "level": "B1-B2", "en": "I'm a software professional with experience in operations, monitoring, and system development.", "pt": "Sou uma profissional de software com experiência em operações, monitoramento e desenvolvimento de sistemas."}, {"id": 164, "category": "Interview", "level": "B1-B2", "en": "My background gave me a strong troubleshooting mindset.", "pt": "Minha experiência me deu uma forte mentalidade de troubleshooting."}, {"id": 165, "category": "Interview", "level": "B1-B2", "en": "More recently, I've been focusing on software development.", "pt": "Mais recentemente, venho focando em desenvolvimento de software."}, {"id": 166, "category": "Interview", "level": "B1-B2", "en": "I'm looking for an opportunity where I can combine technical operations with development.", "pt": "Procuro uma oportunidade em que eu possa combinar operações técnicas com desenvolvimento."}, {"id": 167, "category": "Interview", "level": "B1-B2", "en": "I enjoy understanding how systems behave in production.", "pt": "Gosto de entender como sistemas se comportam em produção."}, {"id": 168, "category": "Interview", "level": "B1-B2", "en": "One of my strengths is staying organized during incidents.", "pt": "Um dos meus pontos fortes é manter organização durante incidentes."}, {"id": 169, "category": "Interview", "level": "B1-B2", "en": "I usually start by gathering evidence before making changes.", "pt": "Normalmente começo coletando evidências antes de fazer mudanças."}, {"id": 170, "category": "Interview", "level": "B1-B2", "en": "I try to communicate clearly with both technical and non-technical people.", "pt": "Procuro me comunicar claramente com pessoas técnicas e não técnicas."}, {"id": 171, "category": "Interview", "level": "B1-B2", "en": "I learn new tools quickly when I can apply them to a real problem.", "pt": "Aprendo novas ferramentas rapidamente quando consigo aplicá-las a um problema real."}, {"id": 172, "category": "Interview", "level": "B1-B2", "en": "I prefer to understand the root cause instead of only treating the symptom.", "pt": "Prefiro entender a causa raiz em vez de apenas tratar o sintoma."}, {"id": 173, "category": "Interview", "level": "B1-B2", "en": "In one project, I built a system to organize operational information.", "pt": "Em um projeto, construí um sistema para organizar informações operacionais."}, {"id": 174, "category": "Interview", "level": "B1-B2", "en": "The main challenge was turning a manual process into a reliable workflow.", "pt": "O principal desafio foi transformar um processo manual em um fluxo confiável."}, {"id": 175, "category": "Interview", "level": "B1-B2", "en": "I broke the problem into smaller parts and implemented them step by step.", "pt": "Dividi o problema em partes menores e implementei passo a passo."}, {"id": 176, "category": "Interview", "level": "B1-B2", "en": "As a result, the process became easier to track and maintain.", "pt": "Como resultado, o processo ficou mais fácil de acompanhar e manter."}, {"id": 177, "category": "Interview", "level": "B1-B2", "en": "If a production system went down, I would first confirm the impact.", "pt": "Se um sistema de produção caísse, eu primeiro confirmaria o impacto."}, {"id": 178, "category": "Interview", "level": "B1-B2", "en": "Then I would check monitoring, logs, recent changes, and dependencies.", "pt": "Depois eu verificaria monitoramento, logs, mudanças recentes e dependências."}, {"id": 179, "category": "Interview", "level": "B1-B2", "en": "If necessary, I would apply a safe rollback to restore service.", "pt": "Se necessário, eu aplicaria um rollback seguro para restaurar o serviço."}, {"id": 180, "category": "Interview", "level": "B1-B2", "en": "After recovery, I would document the root cause and prevention actions.", function drawGlobalSearch(q){
  q=q.trim().toLowerCase();
  const items=[];

}

let flashPool=[],flashIndex=0,flashKind='mixed';
function renderFlashcards(){
  app.innerHTML=`<div class="toolbar" style="justify-content:center"><select id="flashKind" class="select"><option value="mixed">Misto</option><option value="word">Palavras</option><option value="expression">Expressões</option><option value="phrase">Frases</option></select><button class="secondary" id="startFlash">NEW SESSION</button></div><div id="flashStage"></div>`;
  document.getElementById('startFlash').onclick=()=>{flashKind=document.getElementById('flashKind').value;startFlash()};startFlash();
}
function startFlash(){
  const source=flashKind==='word'?D.vocab:flashKind==='expression'?D.expressions:flashKind==='phrase'?D.phrases:[...D.vocab.map(x=>({...x,_kind:'word'})),...D.expressions.map(x=>({...x,_kind:'expression'})),...D.phrases.map(x=>({...x,_kind:'phrase'}))];
  flashPool=[...source].sort(()=>Math.random()-.5).slice(0,200);flashIndex=0;drawFlash();
}
function drawFlash(){
  const x=flashPool[flashIndex%flashPool.length]; const kind=x._kind||flashKind;
  document.getElementById('flashStage').innerHTML=`<div class="flash-wrap"><div class="terminal-label">CARD ${flashIndex+1} / ${flashPool.length} · ${kind.toUpperCase()}</div><div class="flash-card" id="fc"><div><h2>${h(x.en)}</h2>${speaker(x.en,'▶ PLAY')}<div class="answer">${h(x.pt)}</div>${x.example?`<div class="answer" style="color:#9bb0c4;font-size:13px">${h(x.example)}</div>`:''}<p class="hint">Clique no cartão para revelar.</p></div></div><div class="flash-controls"><button class="ghost" data-flash="new">Ainda não</button><button class="secondary" data-flash="learning">Estudando</button><button class="primary" data-flash="known">Dominei</button></div></div>`;
  document.getElementById('fc').onclick=e=>{if(!e.target.closest('button'))e.currentTarget.classList.toggle('revealed')};document.querySelectorAll('[data-flash]').forEach(b=>b.onclick=()=>flashNext(b.dataset.flash));
}
function flashNext(result){
  const x=flashPool[flashIndex%flashPool.length]; const kind=x._kind||flashKind;
  if(result!=='new' && kind!=='mixed'){const map=kind==='word'?state.words:kind==='expression'?state.expressions:state.phrases;map[x.id]=result;save();updateProgress()}
  flashIndex++;drawFlash();
}

let currentQuiz=null;
function renderQuiz(){nextQuiz()}
function nextQuiz(){
  const sources=[['word',D.vocab],['expression',D.expressions],['phrase',D.phrases]];const [kind,arr]=sources[Math.floor(Math.random()*sources.length)];
  const target=arr[Math.floor(Math.random()*arr.length)],mode=Math.random()>.5?'en':'pt';
  const pool=arr.filter(x=>x.id!==target.id),wrong=[...pool].sort(()=>Math.random()-.5).slice(0,3),choices=[target,...wrong].sort(()=>Math.random()-.5);currentQuiz={target,mode,kind};
  app.innerHTML=`<div class="quiz-box"><div class="card"><span class="pill">${kind.toUpperCase()}</span><div class="question">${h(mode==='en'?target.en:target.pt)}</div>${mode==='en'?speaker(target.en,'▶ PLAY'):''}<div class="answers" style="margin-top:14px">${choices.map(c=>`<button class="answer-btn" data-answer="${c.id}">${h(mode==='en'?c.pt:c.en)}</button>`).join('')}</div><p>Score: ${state.quiz.correct||0} / ${state.quiz.total||0}</p></div></div>`;
  document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answerQuiz(b,+b.dataset.answer));
}
function answerQuiz(btn,id){
  if(document.querySelector('.answer-btn.correct'))return; state.quiz.total++; const ok=id===currentQuiz.target.id;
  if(ok){state.quiz.correct++;btn.classList.add('correct');toast('Correct');}else{btn.classList.add('wrong');[...document.querySelectorAll('[data-answer]')].find(b=>+b.dataset.answer===currentQuiz.target.id)?.classList.add('correct')}
  save();setTimeout(nextQuiz,900);
}

let hrLibraryLimit=60;
function hrQuestion(){return HR_INTERVIEW_QUESTIONS[Math.max(0,Math.min(HR_INTERVIEW_QUESTIONS.length-1,state.hrInterview.questionIndex||0))]}
function hrSetStep(n){state.hrInterview.step=Math.max(0,Math.min(4,n));save();renderInterview()}
function hrNextQuestion(){const i=state.hrInterview.questionIndex||0;state.hrInterview.completed[i]=true;state.hrInterview.questionIndex=(i+1)%HR_INTERVIEW_QUESTIONS.length;state.hrInterview.step=0;state.hrInterview.lastTranscript='';state.hrInterview.lastScore=0;save();renderInterview();setTimeout(()=>speakRecruiter(hrQuestion().q,.84),250)}
function hrPrevQuestion(){state.hrInterview.questionIndex=Math.max(0,(state.hrInterview.questionIndex||0)-1);state.hrInterview.step=0;save();renderInterview()}
function hrResetInterview(){state.hrInterview={questionIndex:0,step:0,completed:{},attempts:{},lastTranscript:'',lastScore:0,usedWords:{},usedPhrases:{}};save();renderInterview()}
function speakRecruiter(text,rate=.84){
 if(!('speechSynthesis' in window)){toast('Áudio indisponível neste navegador.');return}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;
 const voices=speechSynthesis.getVoices();const preferred=voices.find(v=>/Samantha|Jenny|Aria|Zira|Female|Google US English/i.test(v.name)&&/^en/i.test(v.lang))||voices.find(v=>/^en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));if(preferred)u.voice=preferred;speechSynthesis.speak(u)
}
function hrModelAnswer(q=hrQuestion()){return q.lines.map(x=>x[0]).join(' ')}
function hrNormalize(s=''){return s.toLowerCase().replace(/[^a-z0-9\s'.-]/g,' ').replace(/\s+/g,' ').trim()}
function hrScoreAnswer(transcript,q=hrQuestion()){
 const stop=new Set('i a an the and or to of in on for with my is am are was were be been being it this that as at from by do does did have has had can could would should will just also more very'.split(' '));
 const t=hrNormalize(transcript),e=hrNormalize(hrModelAnswer(q));if(!t)return 0;
 const tw=new Set(t.split(' ').filter(w=>w.length>2&&!stop.has(w))),ew=[...new Set(e.split(' ').filter(w=>w.length>2&&!stop.has(w)))];
 const overlap=ew.length?ew.filter(w=>tw.has(w)).length/ew.length:0;
 const kw=q.keywords||[];const kwHit=kw.length?kw.filter(k=>t.includes(hrNormalize(k))).length/kw.length:0;
 return Math.round(Math.min(100,(overlap*.55+kwHit*.45)*100));
}
function hrWordsForQuestion(q=hrQuestion()){
 const source=hrNormalize(q.q+' '+hrModelAnswer(q)+' '+q.keywords.join(' '));const tokens=new Set(source.split(/\s+/));
 let rows=D.vocab.filter(x=>tokens.has(hrNormalize(x.en))||source.includes(' '+hrNormalize(x.en)+' '));
 const seen=new Set();rows=rows.filter(x=>{const k=x.en.toLowerCase();if(seen.has(k))return false;seen.add(k);return true});
 return rows.slice(0,14)
}
function hrExtraPhrases(q=hrQuestion()){
 const terms=(q.keywords||[]).map(hrNormalize);const preferred=['Interview answer builder','Natural responses','Observability / Systems Analyst','Questions to master'];
 const scored=D.phrases.map(x=>{const hay=hrNormalize(x.en+' '+x.pt);let score=preferred.includes(x.category)?2:0;terms.forEach(t=>{if(t&&hay.includes(t))score+=4});return [score,x]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]);
 const seen=new Set();return scored.map(x=>x[1]).filter(x=>{if(seen.has(x.id))return false;seen.add(x.id);return true}).slice(0,8)
}
function hrPhraseChunks(q=hrQuestion()){
 const chunks=[];q.lines.forEach(([en,pt])=>{const parts=en.replace(/[.!?]/g,'').split(/,| and | because | so /).map(s=>s.trim()).filter(s=>s.split(/\s+/).length>=2);parts.forEach(p=>chunks.push([p,pt]))});
 return chunks.slice(0,10)
}
function hrInstruction(step){return [
 ['1. Primeiro, apenas escute a pergunta.','Não tente responder ainda. Ouça algumas vezes. Se não entender, clique em “MOSTRAR EM PORTUGUÊS”.'],
 ['2. Agora entenda o significado.','Leia o português e volte a ouvir o inglês. Quando a pergunta fizer sentido para você, avance para aprender uma resposta.'],
 ['3. Aprenda uma resposta curta por partes.','Ouça cada frase, leia a tradução e repita em voz alta. Você não precisa decorar tudo de uma vez.'],
 ['4. Fale com o texto como apoio.','Leia a resposta em inglês e fale junto. O microfone mostra o que conseguiu reconhecer da sua pronúncia.'],
 ['5. Simulação de verdade.','Agora a resposta em inglês fica escondida. A recrutadora pergunta e você responde sozinha. Se travar, use as dicas.']
 ][step]}
function hrRenderSteps(step){const names=['OUVIR','ENTENDER','APRENDER','COM AJUDA','SOZINHA'];return `<div class="hr-stepper">${names.map((n,i)=>`<div class="hr-step ${i<step?'done':i===step?'active':''}"><b>0${i+1}</b>${n}</div>`).join('')}</div>`}
function hrRenderLearning(q,step){
 if(step===0)return `<div class="hr-learning"><h3>Não responda ainda.</h3><p class="hint">Seu único trabalho agora é ouvir. Pode repetir quantas vezes quiser.</p><button class="primary" onclick="hrSetStep(1)">JÁ OUVI → MOSTRAR O SIGNIFICADO</button></div>`;
 if(step===1)return `<div class="hr-learning"><h3>O que a recrutadora perguntou?</h3><p class="sentence-pt">${h(q.pt)}</p><div class="notice"><b>Gramática da pergunta:</b> ${h(q.grammar)}</div><div style="margin-top:13px"><button class="primary" onclick="hrSetStep(2)">ENTENDI → APRENDER UMA RESPOSTA</button></div></div>`;
 if(step===2)return `<div class="hr-learning"><h3>Aprenda a resposta em 3 partes</h3><p class="hint">Ouça uma linha, leia o português e repita. Faça isso várias vezes antes de avançar.</p>${q.lines.map(([en,pt],i)=>`<div class="hr-answer-line"><div><div class="en">${h(en)}</div><div class="pt">${h(pt)}</div></div><div><button class="mini" onclick="speak('${h(en).replace(/'/g,"\'")}',.82)">▶ NORMAL</button><button class="mini" onclick="speak('${h(en).replace(/'/g,"\'")}',.66)">🐢 DEVAGAR</button><button class="mini" onclick="speak('${h(en).replace(/'/g,"\'")}',.48)">🐌 MUITO DEVAGAR</button></div></div>`).join('')}<div style="margin-top:14px"><button class="primary" onclick="hrSetStep(3)">JÁ REPETI → FALAR COM O TEXTO</button></div></div>`;
 if(step===3)return `<div class="hr-learning"><h3>Fale olhando o modelo</h3><p class="hint">Não precisa ficar perfeito. Leia em voz alta com calma. Depois use o microfone para ver o que o navegador reconheceu.</p><div class="template">${q.lines.map(x=>h(x[0])).join('<br>')}</div>${hrSpeechPracticeHTML(q,false)}<div style="margin-top:12px"><button class="primary" onclick="hrSetStep(4)">AGORA QUERO TENTAR SEM TEXTO →</button></div></div>`;
 return `<div class="hr-learning"><h3>Entrevista: responda sem olhar</h3><p class="hint">A recrutadora fará a pergunta. Responda com suas palavras. Você pode usar as ideias em português abaixo, mas o inglês fica escondido.</p><div class="notice"><b>Ideias que sua resposta deve conter:</b> ${q.lines.map(x=>h(x[1])).join(' • ')}</div>${hrSpeechPracticeHTML(q,true)}</div>`
}
function hrSpeechPracticeHTML(q,hidden){
 const idx=state.hrInterview.questionIndex||0,attempts=state.hrInterview.attempts[idx]||0,score=state.hrInterview.lastScore||0,trans=state.hrInterview.lastTranscript||'';
 return `<div class="hr-speech-box"><div class="hr-controls"><button class="secondary" onclick="hrRecordAnswer()">🎙 FALAR EM INGLÊS</button><button class="ghost" onclick="speakRecruiter(hrQuestion().q,.78)">▶ OUVIR RH</button>${hidden&&attempts>=3?`<button class="ghost" onclick="hrSetStep(3)">VER MODELO NOVAMENTE</button>`:''}${hidden&&attempts>=5?`<button class="ghost" onclick="speak(hrModelAnswer(),.72)">🔊 OUVIR RESPOSTA</button><button class="ghost" onclick="speak(hrModelAnswer(),.48)">🐌 RESPOSTA MUITO DEVAGAR</button>`:''}</div><textarea id="hrManualAnswer" placeholder="Se o microfone não funcionar, você também pode digitar sua resposta aqui...">${h(trans)}</textarea><div style="margin-top:8px"><button class="mini" onclick="hrEvaluateTyped()">AVALIAR O QUE ESCREVI</button></div>${trans?`<div class="hr-score"><strong>${score}%</strong><span>${score>=55?'Boa! Você já transmitiu parte importante da resposta.':'Ainda falta vocabulário da resposta. Treine de novo sem pressa.'}<br>Tentativas nesta pergunta: ${attempts}</span></div>`:''}${score>=55&&hidden?`<div class="hr-recruiter-reply"><b>Emma, RH:</b> Great, thank you. That was clear enough to continue. Quando estiver pronta, passe para a próxima pergunta.</div><div style="margin-top:10px"><button class="primary" onclick="hrNextQuestion()">PRÓXIMA PERGUNTA →</button></div>`:''}</div>`
}
function hrRecordAnswer(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('O microfone por reconhecimento de voz não está disponível. Digite a resposta no campo abaixo.');return}
 const r=new SR();r.lang='en-US';r.interimResults=true;r.continuous=false;const box=document.getElementById('hrManualAnswer');if(box)box.value='Ouvindo...';let finalText='';
 r.onresult=e=>{finalText=[...e.results].map(x=>x[0].transcript).join(' ');if(box)box.value=finalText};
 r.onerror=()=>toast('Não consegui captar sua voz. Tente novamente ou digite a resposta.');
 r.onend=()=>{if(finalText)hrSaveEvaluation(finalText)};r.start()
}
function hrEvaluateTyped(){const el=document.getElementById('hrManualAnswer');if(!el||!el.value.trim()){toast('Fale ou digite uma resposta primeiro.');return}hrSaveEvaluation(el.value)}
function hrSaveEvaluation(t){const i=state.hrInterview.questionIndex||0;state.hrInterview.attempts[i]=(state.hrInterview.attempts[i]||0)+1;state.hrInterview.lastTranscript=t;state.hrInterview.lastScore=hrScoreAnswer(t);if(state.hrInterview.lastScore<55)addMistake('Entrevista RH',hrQuestion().pt,hrModelAnswer(),t);updateSkill('speaking',state.hrInterview.lastScore>=55?.45:-.08);save();renderInterview()}

let scanIndex=0,scanScores={vocabulary:[0,0],grammar:[0,0],reading:[0,0],listening:[0,0],speaking:[0,0]},scanAnswerSlots=[];
function buildScanAnswerSlots(){
 const slots=[];
 while(slots.length<scanQuestions.length){
   const batch=[0,1,2,3];
   for(let i=batch.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[batch[i],batch[j]]=[batch[j],batch[i]]}
   if(slots.length && batch[0]===slots[slots.length-1]){const swapIndex=batch.findIndex(v=>v!==slots[slots.length-1]);[batch[0],batch[swapIndex]]=[batch[swapIndex],batch[0]]}
   slots.push(...batch);
 }
 return slots.slice(0,scanQuestions.length);
}
function resetScan(){scanIndex=0;scanScores={vocabulary:[0,0],grammar:[0,0],reading:[0,0],listening:[0,0],speaking:[0,0]};scanAnswerSlots=buildScanAnswerSlots();renderAssessment()}

(function enrichSystemsAnalystGrammarAndDocs(){
 const grammar=[
  {level:'A2-B1',title:'Explaining architecture: subject + responsibility',rule:'Para explicar arquitetura, use um componente como sujeito e um verbo de responsabilidade: “The backend handles…”, “The frontend displays…”, “The API validates…”.',examples:['The Node.js backend handles business logic and data processing.','The React frontend displays operational information to the user.','The API validates the request before processing it.']},
  {level:'B1',title:'Incident updates: Past Simple vs Present Perfect',rule:'Use Past Simple para eventos concluídos com tempo definido; use Present Perfect para ações recentes relevantes agora.',examples:['The service failed at 10 a.m.','We have identified the affected endpoints.','I have already checked the logs.']},
  {level:'B1',title:'Technical hypotheses: might, could, seems to',rule:'Em troubleshooting, use modais e “seems to” para levantar hipóteses sem afirmar algo ainda não comprovado.',examples:['The issue might be related to network authentication.','This could be caused by packet loss.','The problem seems to affect only one endpoint.']},
  {level:'B1-B2',title:'Troubleshooting conditionals',rule:'Use if + present para descrever decisões e consequências em investigação técnica.',examples:['If multiple rooms are affected, I look for a shared dependency.','If the deployment causes impact, we roll it back.','If I cannot reproduce the issue, I compare logs and timestamps.']},
  {level:'B1-B2',title:'STAR connectors for interviews',rule:'Organize histórias com contexto, ação e resultado. Conectores simples soam mais naturais do que frases excessivamente complexas.',examples:['The main challenge was scattered operational information.','I decided to centralize the workflow in a web application.','As a result, the team had a clearer view of incidents and evidence.']}
 ];

 const docs=[
  {level:'B1',title:'Observability System — Architecture Overview',text:'The observability system centralizes operational information from a corporate videoconferencing environment. The React frontend organizes dashboards, filters, incidents, inventory and evidence for the operator. The Node.js backend exposes APIs, applies business rules, normalizes data and coordinates integrations. The goal is not only to display alarms, but to provide enough context to investigate recurring failures and support operational decisions.',questions:['What is the responsibility of the React frontend?','What does the Node.js backend handle?','Why is context important in this system?']},
  {level:'B1',title:'Incident Runbook — Endpoint Connectivity',text:'When an endpoint loses connectivity, first confirm the scope and impact. Check power, physical connection, IP address, gateway and basic reachability. If the network uses authentication, validate the endpoint identity and policy. Review VLAN assignment and switch-port context when necessary. Record timestamps, MAC address, tests and evidence before escalating to the network team.',questions:['What should be confirmed first?','Which network information should be checked?','What evidence should be included before escalation?']},
  {level:'B1-B2',title:'Observability — Recurring Alerts',text:'A recurring alert does not automatically mean a recurring root cause. The analyst should compare alert timestamps, service impact, related metrics and incident history. If the condition is repeatedly confirmed as a false positive, the alert rule or threshold may need to be reviewed. The objective is to reduce alert fatigue without hiding real operational risk.',questions:['Why can a recurring alert be misleading?','What evidence should be compared?','What is the risk of changing an alert rule incorrectly?']},

 ];

const TECH_INTERVIEW_QUESTIONS=[
 {cat:'Observabilidade',level:'Base',q:'What is the difference between monitoring and observability?',pt:'Qual é a diferença entre monitoramento e observabilidade?',structure:'Definição → diferença → exemplo prático',keywords:['monitoring','observability','metrics','logs','context'],beginner:'Monitoring tells me when a known condition happens. Observability helps me investigate why it happened by combining different signals and context.',professional:'Monitoring tracks known conditions through metrics, checks and alerts. Observability goes further: it helps me understand the internal state of a system by correlating logs, metrics, alarms, incident history and contextual data, especially when the failure mode was not predefined.'},
 {cat:'Observabilidade',level:'Base',q:'Which signals do you use when investigating an incident?',pt:'Quais sinais você usa ao investigar um incidente?',structure:'Sinais → correlação → decisão',keywords:['logs','metrics','alerts','changes','incident'],beginner:'I check logs, metrics, alerts and recent changes. Then I compare the evidence to understand the incident.',professional:'I usually start with impact and timeline, then correlate logs, metrics, alarms, recent changes, endpoint health and incident history. I use those signals to narrow down the scope before I make a change or escalate.'},
 {cat:'Observabilidade',level:'Intermediário',q:'How do you deal with recurring alerts and false positives?',pt:'Como você lida com alertas recorrentes e falsos positivos?',structure:'Problema → evidência → ajuste → resultado',keywords:['recurring','false positive','threshold','history','alert'],beginner:'I check the alert history and confirm whether the condition is real. If it is a false positive, I review the rule or threshold.',professional:'I compare the alert with historical evidence and actual service impact. For recurring false positives, I review thresholds, alert logic and dependencies, and I document the pattern so the team can reduce alert fatigue without hiding real failures.'},
 {cat:'Observabilidade',level:'Intermediário',q:'How would you design an observability dashboard for operations?',pt:'Como você projetaria um dashboard de observabilidade para operações?',structure:'Usuário → decisão → sinais → priorização',keywords:['dashboard','impact','priority','metrics','incidents'],beginner:'I would show service status, alerts, incidents and important metrics in one place.',professional:'I would design the dashboard around operational decisions, not around raw data. I would prioritize current impact, severity, affected endpoints, recurring incidents, service health, key metrics and recent changes, with drill-down paths for evidence and troubleshooting.'},
 {cat:'Incidentes',level:'Base',q:'Walk me through your troubleshooting process.',pt:'Explique passo a passo seu processo de troubleshooting.',structure:'Confirmar → coletar → isolar → testar → resolver → documentar',keywords:['impact','evidence','logs','root cause','document'],beginner:'First, I confirm the problem. Then I check logs and monitoring data, test possible causes and document the result.',professional:'First, I validate the impact and define the scope. Then I collect evidence, correlate logs and monitoring data, review recent changes, rule out likely causes, test the safest hypothesis, restore service, and document the root cause or the evidence used for escalation.'},
 {cat:'Incidentes',level:'Intermediário',q:'What do you do before escalating an incident to another team?',pt:'O que você faz antes de escalar um incidente para outra equipe?',structure:'Escopo → testes → evidências → pedido claro',keywords:['impact','tests','evidence','logs','escalate'],beginner:'I confirm the impact, perform basic tests and send the evidence to the responsible team.',professional:'Before escalating, I make sure the scope is clear, basic checks have been completed, relevant logs and timestamps are attached, and I explain what has already been ruled out. That makes the escalation actionable instead of simply transferring the problem.'},
 {cat:'Incidentes',level:'Intermediário',q:'How do you distinguish a symptom from a root cause?',pt:'Como você diferencia um sintoma de uma causa raiz?',structure:'Sintoma → cadeia causal → evidência',keywords:['symptom','root cause','evidence','cause','impact'],beginner:'A symptom is what I can see. The root cause is the underlying reason that created the problem.',professional:'I treat the symptom as the observable effect and keep asking what dependency or event could have produced it. I validate each hypothesis with evidence until the causal chain explains both the failure and the observed impact.'},
 {cat:'Redes',level:'Base',q:'How can latency, jitter and packet loss affect a videoconference?',pt:'Como latência, jitter e perda de pacotes podem afetar uma videoconferência?',structure:'Termo → efeito → experiência do usuário',keywords:['latency','jitter','packet loss','audio','video'],beginner:'High latency creates delay, jitter makes delivery inconsistent, and packet loss can cause audio or video problems.',professional:'High latency increases end-to-end delay, jitter makes packet arrival inconsistent, and packet loss can cause gaps, frozen video, robotic audio or quality degradation. I correlate those metrics with the time of the user complaint before concluding that the network is the cause.'},
 {cat:'Redes',level:'Intermediário',q:'How would you investigate an endpoint that cannot connect to the network?',pt:'Como você investigaria um endpoint que não consegue conectar à rede?',structure:'Físico → IP → autenticação → VLAN/política → escalada',keywords:['ip','authentication','VLAN','network','connectivity'],beginner:'I check power, cable, IP address and network authentication first.',professional:'I start with physical connectivity and power, then validate IP addressing, gateway and reachability. After that I check authentication, network policy, VLAN assignment and switch-port context. I escalate with MAC address, timestamps and the tests already completed.'},
 {cat:'Sistemas',level:'Base',q:'What does a Systems Analyst do in your view?',pt:'Na sua visão, o que faz um Analista de Sistemas?',structure:'Entender problema → modelar solução → conectar negócio e tecnologia',keywords:['requirements','systems','business','solution','stakeholders'],beginner:'A Systems Analyst understands business or operational needs and helps turn them into system requirements and solutions.',professional:'A Systems Analyst bridges operational or business needs and technology. The role involves understanding workflows, clarifying requirements, analyzing data and integrations, defining solution behavior, collaborating with stakeholders and validating that the delivered system actually solves the problem.'},
 {cat:'Sistemas',level:'Intermediário',q:'How do you turn an operational problem into a software requirement?',pt:'Como você transforma um problema operacional em requisito de software?',structure:'Dor → fluxo atual → regra → aceite',keywords:['workflow','requirement','user','acceptance','problem'],beginner:'I understand the problem, identify the user need and write the expected system behavior.',professional:'I first understand the current workflow, users, pain points and evidence. Then I separate the real requirement from the proposed solution, define functional behavior and constraints, identify data and integrations, and create clear acceptance criteria that can be validated.'},
 {cat:'Sistemas',level:'Intermediário',q:'What is the difference between a functional and a non-functional requirement?',pt:'Qual é a diferença entre requisito funcional e não funcional?',structure:'O que faz → como deve se comportar',keywords:['functional','non-functional','performance','security','behavior'],beginner:'A functional requirement describes what the system does. A non-functional requirement describes qualities such as performance, security or availability.',professional:'Functional requirements define system behavior and capabilities, while non-functional requirements define quality attributes and constraints, such as performance, availability, security, scalability, usability and maintainability.'},
 {cat:'React',level:'Base',q:'Why did you choose React for the frontend?',pt:'Por que você escolheu React para o frontend?',structure:'Necessidade → benefício → uso no projeto',keywords:['React','components','interface','state','reusable'],beginner:'I used React because it helps me build interactive interfaces with reusable components.',professional:'React was a good fit because the interface is dashboard-oriented and has repeated UI patterns, filters and state changes. Reusable components helped me organize the frontend and evolve screens without duplicating the same logic everywhere.'},
 {cat:'React',level:'Intermediário',q:'How do you organize state and reusable components in a dashboard?',pt:'Como você organiza estado e componentes reutilizáveis em um dashboard?',structure:'Estado → responsabilidade → reutilização',keywords:['state','components','props','data','reusable'],beginner:'I keep shared data in state and create reusable components for repeated interface elements.',professional:'I try to keep state close to the feature that owns it, lift it only when multiple components need the same source of truth, and separate presentational components from data and business logic. For dashboards, I reuse cards, tables, filters and status components with predictable props.'},
 {cat:'Node.js',level:'Base',q:'What is the role of Node.js in your application?',pt:'Qual é o papel do Node.js na sua aplicação?',structure:'Entrada → lógica → dados → resposta',keywords:['Node.js','backend','API','data','business logic'],beginner:'Node.js handles the backend logic, APIs and data processing.',professional:'Node.js acts as the backend layer. It exposes application endpoints, applies business rules, validates requests, coordinates data access and integrations, and returns normalized data to the React frontend.'},
 {cat:'Node.js',level:'Intermediário',q:'How would you structure a Node.js backend for maintainability?',pt:'Como você estruturaria um backend Node.js pensando em manutenibilidade?',structure:'Rotas → serviços → regras → dados → erros',keywords:['routes','services','business logic','validation','errors'],beginner:'I separate routes, business logic and data access instead of putting everything in one file.',professional:'I separate transport concerns from business logic: routes/controllers handle HTTP, services contain domain behavior, repositories or data modules isolate persistence, and shared validation and error handling keep the API consistent. That makes testing and future integrations easier.'},
 {cat:'APIs',level:'Base',q:'What happens when a frontend sends a request to an API?',pt:'O que acontece quando um frontend envia uma requisição para uma API?',structure:'Request → validation → logic → data → response',keywords:['request','API','validate','process','response'],beginner:'The frontend sends a request, the API validates and processes it, and then returns a response.',professional:'The client sends an HTTP request to an endpoint. The backend authenticates or validates the request, executes the appropriate business logic, reads or writes data when needed, and returns a status code and response payload.'},
 {cat:'APIs',level:'Intermediário',q:'How do you handle API errors in a user-facing system?',pt:'Como você trata erros de API em um sistema usado por pessoas?',structure:'Detectar → classificar → registrar → informar → recuperar',keywords:['error','status','log','user','retry'],beginner:'I handle the error, log useful information and show a clear message to the user.',professional:'I distinguish expected validation errors from unexpected failures, return consistent status codes and messages, log enough context for troubleshooting, avoid exposing sensitive details, and use retry or fallback behavior only when it is safe and meaningful.'},
 {cat:'Dados',level:'Base',q:'Why is data validation important?',pt:'Por que validação de dados é importante?',structure:'Entrada → regra → integridade',keywords:['validation','data','invalid','integrity','security'],beginner:'Data validation prevents invalid information from entering the system.',professional:'Validation protects data integrity and system behavior. I validate type, required fields, formats and business rules at the appropriate boundaries, especially on the backend because client-side validation alone cannot be trusted.'},
 {cat:'Dados',level:'Intermediário',q:'How would you investigate a slow database-dependent feature?',pt:'Como você investigaria uma funcionalidade lenta que depende do banco de dados?',structure:'Medir → separar camada → query → índice/conexão → validar',keywords:['database','query','latency','index','connection'],beginner:'I measure where the delay happens and check the database query and connection.',professional:'I first separate frontend, API and database timing. If the database is the bottleneck, I inspect query duration, execution plan, indexes, returned data volume, connection-pool behavior and contention, then measure again after the change instead of assuming the database was the cause.'},
 {cat:'DevOps',level:'Base',q:'What is a rollback and when would you use it?',pt:'O que é rollback e quando você usaria?',structure:'Definição → condição → segurança',keywords:['rollback','deployment','version','production','restore'],beginner:'A rollback returns the application to a previous version when a deployment causes a serious problem.',professional:'A rollback is a controlled return to a previously known-good release. I would use it when a production change introduces significant impact and reverting is safer and faster than debugging the new version while users remain affected.'},
 {cat:'DevOps',level:'Intermediário',q:'What would you monitor after a production deployment?',pt:'O que você monitoraria depois de um deploy em produção?',structure:'Saúde → erros → performance → negócio → comparação',keywords:['deployment','errors','latency','health','metrics'],beginner:'I monitor errors, application health and performance after the deployment.',professional:'I compare post-deployment health with the previous baseline: error rate, latency, availability, resource behavior, critical business or operational flows and new alerts. I also watch for changes in incident volume before considering the deployment stable.'},
 {cat:'Projeto',level:'Base',q:'Tell me about the observability system you built.',pt:'Conte sobre o sistema de observabilidade que você desenvolveu.',structure:'Problema → solução → stack → valor',keywords:['observability','React','Node.js','incidents','monitoring'],beginner:'I built an observability system with React and Node.js to centralize monitoring and incident information.',professional:'I built a web-based observability system using React and Node.js to centralize operational information from a corporate videoconferencing environment. The goal was to make alarms, incidents, inventory, evidence and recurring failures easier to analyze in one workflow instead of depending on scattered information.'},
 {cat:'Projeto',level:'Intermediário',q:'What problem were you trying to solve with your observability system?',pt:'Qual problema você estava tentando resolver com seu sistema de observabilidade?',structure:'Antes → dor → decisão → depois',keywords:['operational','information','incidents','centralize','analysis'],beginner:'Operational information was spread across different tools, so I wanted to centralize it and make incident analysis easier.',professional:'The operational workflow depended on multiple sources for alarms, device context, incident history and evidence. That fragmentation made recurring failures and prioritization harder. I designed the system to centralize the workflow and turn scattered operational data into information that supports troubleshooting and decision-making.'},
 {cat:'Projeto',level:'Intermediário',q:'How is your observability system structured?',pt:'Como seu sistema de observabilidade é estruturado?',structure:'Frontend → backend → dados → integrações → usuário',keywords:['React','Node.js','frontend','backend','data'],beginner:'The frontend is built with React and the backend uses Node.js. The system organizes monitoring and incident data for the user.',professional:'The frontend is component-based and focused on operational dashboards and workflows. The Node.js backend handles APIs, business logic, normalization and data access. The architecture is designed so monitoring sources and operational modules can evolve without coupling the interface directly to each external source.'},
 {cat:'Projeto',level:'Avançado',q:'What would you improve in the observability system today?',pt:'O que você melhoraria hoje no sistema de observabilidade?',structure:'Limite atual → melhoria → benefício → risco',keywords:['automation','correlation','testing','architecture','observability'],beginner:'I would improve automation, testing and integrations.',professional:'I would strengthen automated correlation, structured event normalization, tests, access control and deployment discipline. I would also evolve the architecture toward clearer service boundaries and add measured indicators such as recurring incident rate, alert quality and time spent in each troubleshooting stage.'},
 {cat:'Comportamental',level:'Base',q:'What is one of your strongest professional advantages?',pt:'Qual é uma das suas maiores vantagens profissionais?',structure:'Força → evidência → valor',keywords:['experience','operations','troubleshooting','systems','development'],beginner:'My operational experience helps me understand real problems before I build a solution.',professional:'One of my strongest advantages is that I combine long-term operational experience with systems development. I understand what happens during a real incident, so when I design a tool or requirement I naturally think about evidence, usability, escalation and the decisions an operator needs to make.'},
 {cat:'Comportamental',level:'Intermediário',q:'How do you learn a technology you do not know yet?',pt:'Como você aprende uma tecnologia que ainda não conhece?',structure:'Objetivo → documentação → teste → aplicação → validação',keywords:['documentation','test','practice','problem','learn'],beginner:'I read the documentation, make small tests and apply what I learn to a real problem.',professional:'I start from the problem I need to solve, identify the minimum concepts I need, read primary documentation, build a small isolated test and then integrate it gradually. I validate the result instead of assuming that code working once means I fully understand the technology.'},
 {cat:'Comportamental',level:'Intermediário',q:'What do you do when you do not know the answer in an interview?',pt:'O que você faz quando não sabe uma resposta em uma entrevista?',structure:'Honestidade → raciocínio → abordagem',keywords:['not sure','approach','documentation','test','understand'],beginner:"If I don't know, I say that honestly and explain how I would investigate the problem.",professional:"If I am not sure, I avoid guessing as if I knew. I explain what I do know, ask for any missing context, describe how I would investigate it, and mention the documentation or tests I would use to validate the answer."},
 {cat:'Videoconferência',level:'Base',q:'How would you investigate a meeting room where the camera is not detected?',pt:'Como você investigaria uma sala em que a câmera não é detectada?',structure:'Escopo → conexão → energia → configuração → logs → teste',keywords:['camera','connection','power','configuration','logs'],beginner:'I check the camera connection, power, configuration and logs, and then I test whether the room system can detect the device.',professional:'I first confirm whether the issue affects only the camera or the whole room system. Then I check physical connection and power, device recognition, configuration, firmware or recent changes, and relevant logs. I test the peripheral separately when possible before deciding whether the issue is hardware, configuration or the room endpoint.'},
 {cat:'Videoconferência',level:'Intermediário',q:'What would an APIPA address tell you during troubleshooting?',pt:'O que um endereço APIPA indicaria durante o troubleshooting?',structure:'Sinal → hipótese → validação',keywords:['APIPA','DHCP','IP','network','address'],beginner:'An APIPA address usually means the device did not receive a valid IP address from DHCP.',professional:'An APIPA address is a strong signal that the endpoint failed to obtain a normal address through DHCP. I would validate physical connectivity, VLAN and port context, DHCP reachability and authentication before assuming the device itself is faulty.'},
 {cat:'Ferramentas',level:'Base',q:'How do you use Zabbix and Grafana in operations?',pt:'Como você usa Zabbix e Grafana na operação?',structure:'Ferramenta → dado → decisão',keywords:['Zabbix','Grafana','alerts','metrics','dashboard'],beginner:'I use Zabbix for monitoring and alerts and Grafana for dashboards and metrics visualization.',professional:'I use monitoring platforms such as Zabbix to track conditions and alarms, while Grafana helps visualize metrics and trends. The value is not the tool itself; it is combining the signal with incident context to decide what needs investigation.'},
 {cat:'Ferramentas',level:'Base',q:'How does ServiceNow support your incident workflow?',pt:'Como o ServiceNow apoia seu fluxo de incidentes?',structure:'Registro → rastreabilidade → escalada → fechamento',keywords:['ServiceNow','incident','ticket','evidence','escalation'],beginner:'I use ServiceNow to register incidents, track actions and communicate with responsible teams.',professional:'ServiceNow provides traceability for the incident lifecycle. I use tickets to register impact, timestamps, evidence, troubleshooting already performed, escalation context and resolution, which helps both operational communication and later analysis.'},
 {cat:'Incidentes',level:'Intermediário',q:'How do you communicate during a high-impact incident?',pt:'Como você se comunica durante um incidente de alto impacto?',structure:'Fato → impacto → ação → próximo update',keywords:['impact','status','evidence','team','update'],beginner:'I communicate the current impact, what has been checked and what the team is doing next.',professional:'I keep updates factual and structured: current impact, confirmed evidence, actions already taken, owner of the next step and when the next update is expected. I avoid presenting an unconfirmed hypothesis as the root cause.'},
 {cat:'Sistemas',level:'Avançado',q:'How would you prevent an observability dashboard from becoming just another screen full of data?',pt:'Como você evitaria que um dashboard de observabilidade virasse apenas mais uma tela cheia de dados?',structure:'Decisão → prioridade → contexto → ação',keywords:['decision','priority','context','actionable','dashboard'],beginner:'I would show only information that helps the user make a decision or investigate a problem.',professional:'I would design around decisions and workflows. Every major element should answer a question such as what is affected, how severe it is, what changed, whether it is recurring and what evidence is available. I would progressively disclose detail instead of placing every metric on the first screen.'}

function techFiltered(){const cat=state.techInterview.category||'Todos',lev=state.techInterview.level||'Todos';return TECH_INTERVIEW_QUESTIONS.filter(x=>(cat==='Todos'||x.cat===cat)&&(lev==='Todos'||x.level===lev));}
function techQuestion(){const arr=techFiltered();if(!arr.length)return TECH_INTERVIEW_QUESTIONS[0];state.techInterview.index=Math.min(state.techInterview.index||0,arr.length-1);return arr[state.techInterview.index]}
function techSetStep(n){state.techInterview.step=Math.max(0,Math.min(4,n));safeSave();renderTechnicalInterview()}
function techPrev(){state.techInterview.index=Math.max(0,(state.techInterview.index||0)-1);state.techInterview.step=0;state.techInterview.lastTranscript='';safeSave();renderTechnicalInterview()}
function techNext(){const arr=techFiltered();state.techInterview.index=((state.techInterview.index||0)+1)%arr.length;state.techInterview.step=0;state.techInterview.lastTranscript='';state.techInterview.lastScore=0;safeSave();renderTechnicalInterview();setTimeout(()=>speak(techQuestion().q,.72),200)}
function techApplyFilter(){state.techInterview.category=document.getElementById('techCat')?.value||'Todos';state.techInterview.level=document.getElementById('techLevel')?.value||'Todos';state.techInterview.index=0;state.techInterview.step=0;safeSave();renderTechnicalInterview()}
function techScoreAnswer(text,q){const n=normalizeText(text),words=n.split(' ').filter(Boolean),keys=q.keywords||[];const hit=keys.filter(k=>n.includes(normalizeText(k))).length;const coverage=Math.round(hit/Math.max(1,keys.length)*100);const connectors=['first','then','because','after','before','when','if','so','result','finally','while','which','instead'];const conn=connectors.filter(x=>words.includes(x)).length;const structure=Math.min(100,Math.round(Math.min(1,words.length/32)*70+Math.min(30,conn*10)));const clarity=Math.min(100,Math.round(Math.min(1,words.length/22)*70+(words.length>=8?30:0)));const total=Math.round(coverage*.5+structure*.3+clarity*.2);return {total,coverage,structure,clarity,hit,totalKeys:keys.length}}
function techEvaluateText(text){const q=techQuestion();const s=techScoreAnswer(text,q),key=normalizeText(q.q);state.techInterview.attempts[key]=(state.techInterview.attempts[key]||0)+1;state.techInterview.lastTranscript=text;state.techInterview.lastScore=s.total;if(s.total>=80)state.techInterview.mastered[key]=true;if(s.total<55)addMistake('Entrevista Técnica',q.pt,q.professional,text);updateSkill('speaking',s.total>=80?.7:s.total>=60?.2:-.08);safeSave();renderTechnicalInterview()}
function techEvaluateTyped(){const t=document.getElementById('techAnswer')?.value.trim();if(!t){toast('Digite ou fale uma resposta em inglês.');return}techEvaluateText(t)}
function techRecord(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Reconhecimento de voz indisponível. Digite a resposta.');return}const r=new SR();r.lang='en-US';r.interimResults=true;r.continuous=false;const ta=document.getElementById('techAnswer');let txt='';if(ta)ta.value='Ouvindo...';r.onresult=e=>{txt=[...e.results].map(x=>x[0].transcript).join(' ');if(ta)ta.value=txt};r.onerror=()=>toast('Não consegui captar sua voz. Você pode digitar.');r.onend=()=>{if(txt.trim())techEvaluateText(txt.trim())};r.start()}
function techMasteredPct(){const count=Object.values(state.techInterview.mastered||{}).filter(Boolean).length;return Math.min(100,Math.round(count/20*100))}
function renderTechnicalInterview(){const q=techQuestion(),arr=techFiltered(),i=Math.min(state.techInterview.index||0,arr.length-1),step=state.techInterview.step||0,score=state.techInterview.lastScore||0,scoreClass=score>=80?'tech-score-good':score>=60?'tech-score-mid':'tech-score-low',cats=['Todos',...new Set(TECH_INTERVIEW_QUESTIONS.map(x=>x.cat))];const evalData=state.techInterview.lastTranscript?techScoreAnswer(state.techInterview.lastTranscript,q):null;app.innerHTML=`<div class="notice"><b>Entrevista técnica guiada:</b> você não precisa saber responder de primeira. Aprenda em camadas e só tente responder sem ajuda depois de entender a estrutura e o vocabulário.</div><div class="toolbar"><select id="techCat" class="select" onchange="techApplyFilter()">${cats.map(c=>`<option ${c===state.techInterview.category?'selected':''}>${h(c)}</option>`).join('')}</select><select id="techLevel" class="select" onchange="techApplyFilter()">${['Todos','Base','Intermediário','Avançado'].map(c=>`<option ${c===state.techInterview.level?'selected':''}>${h(c)}</option>`).join('')}</select><span class="level-chip">${Object.values(state.techInterview.mastered||{}).filter(Boolean).length} perguntas dominadas</span></div><div class="tech-shell"><section class="tech-stage"><div class="tech-person"><div class="tech-avatar">👨‍💻</div><div><strong>Alex</strong><small>Senior Systems Engineer · Entrevistador técnico virtual</small></div><div style="margin-left:auto"><span class="pill">${h(q.cat)} · ${h(q.level)}</span></div></div><div class="tech-stepbar">${['OUVIR','ENTENDER','ESTRUTURAR','APRENDER','RESPONDER'].map((x,n)=>`<div class="tech-step ${n===step?'on':n<step?'done':''}">${n+1}. ${x}</div>`).join('')}</div><div class="tech-question">${h(q.q)}</div><div class="hr-controls"><button class="secondary" onclick="speak(techQuestion().q,.82)">▶ NORMAL</button><button class="ghost" onclick="speak(techQuestion().q,.60)">🐢 DEVAGAR</button><button class="ghost" onclick="speak(techQuestion().q,.38)">🐌 MUITO DEVAGAR</button>${step===0?`<button class="ghost" onclick="techSetStep(1)">NÃO ENTENDI · MOSTRAR PORTUGUÊS</button>`:''}</div>${step>=1?`<div class="tech-translation"><b>Em português:</b> ${h(q.pt)}</div>`:''}${step>=2?`<div class="ladder-card"><h4>Como estruturar sua resposta</h4><div class="en">${h(q.structure)}</div><div class="keyword-cloud">${q.keywords.map(k=>`<span>${h(k)}</span>`).join('')}</div></div>`:''}${step>=3?`<div class="answer-ladder"><div class="ladder-card"><span class="pill">RESPOSTA INICIANTE</span><div class="en">${h(q.beginner)}</div><div style="margin-top:8px"><button class="mini" onclick="speak('${h(q.beginner).replace(/'/g,"\\'")}',.66)">🐢 OUVIR DEVAGAR</button><button class="mini" onclick="speak('${h(q.beginner).replace(/'/g,"\\'")}',.40)">🐌 MUITO DEVAGAR</button></div></div><div class="ladder-card"><span class="pill">RESPOSTA PROFISSIONAL</span><div class="en">${h(q.professional)}</div><div style="margin-top:8px"><button class="mini" onclick="speak('${h(q.professional).replace(/'/g,"\\'")}',.76)">▶ OUVIR</button><button class="mini" onclick="speak('${h(q.professional).replace(/'/g,"\\'")}',.50)">🐢 DEVAGAR</button></div></div></div>`:''}${step>=4?`<div class="ladder-card"><h4>Agora responda sem copiar</h4><textarea id="techAnswer" rows="5" style="width:100%" placeholder="Fale pelo microfone ou escreva sua resposta em inglês...">${h(state.techInterview.lastTranscript||'')}</textarea><div class="hr-controls" style="margin-top:8px"><button class="primary" onclick="techRecord()">🎙 FALAR EM INGLÊS</button><button class="secondary" onclick="techEvaluateTyped()">AVALIAR TEXTO</button></div>${state.techInterview.lastTranscript?`<div class="rubric"><div><b class="${scoreClass}">${evalData.total}%</b><small>pontuação heurística</small></div><div><b>${evalData.coverage}%</b><small>conceitos cobertos</small></div><div><b>${evalData.structure}%</b><small>estrutura da resposta</small></div></div><div class="notice" style="margin-top:9px"><b>${score>=80?'✓ Domínio registrado':score>=60?'Boa base; tente acrescentar os conceitos que faltaram.':'Ainda está curta ou faltam conceitos-chave.'}</b><br><small>Esse avaliador é local e heurístico: ele mede cobertura de palavras/conceitos e estrutura, não substitui avaliação humana de pronúncia ou conhecimento técnico.</small></div>`:''}</div>`:''}<div class="hr-controls" style="margin-top:14px"><button class="ghost" onclick="techPrev()" ${i===0?'disabled style="opacity:.4"':''}>← ANTERIOR</button>${step<4?`<button class="primary" onclick="techSetStep(${step+1})">PRÓXIMA ETAPA →</button>`:`<button class="primary" onclick="techNext()">PRÓXIMA PERGUNTA →</button>`}</div></section><aside class="tech-side"><span class="pill">SEU FOCO</span><h3>Systems Analyst + Observability</h3><p style="color:var(--muted)">Esta trilha mistura análise de sistemas, React, Node.js, APIs, redes, incidentes, monitoramento e observabilidade.</p><div class="interview-preset"><b>Projeto principal</b><div style="margin-top:5px">${h(state.profile.project)}</div><small style="color:var(--muted)">${h(state.profile.stack)}</small></div><h4>Como pensar em entrevista</h4><ol class="question-list"><li>Não tente usar palavras difíceis só para parecer avançada.</li><li>Comece com uma resposta simples e correta.</li><li>Explique seu raciocínio técnico.</li><li>Dê um exemplo real quando possível.</li><li>Se não souber, explique como investigaria.</li></ol><button class="secondary" onclick="navigate('career')">ABRIR MINHA HISTÓRIA</button></aside></div>`}

function applyFlaviaCareerPreset(){Object.assign(state.profile,{role:'Systems Analyst',seniority:'Pleno',stack:'React, Node.js, Next.js, Zabbix, Grafana, ServiceNow',project:'corporate videoconference observability system',company:'Globo',background:'20+ years in telecom, NOC, networks, monitoring, troubleshooting and corporate videoconferencing',strengths:'troubleshooting, incident analysis, monitoring, observability, operational requirements, systems thinking',tools:'React, Node.js, Next.js, Zabbix, Grafana, ServiceNow, Broadcom, Poly Lens'});safeSave();toast('Preset profissional aplicado.');renderCareer()}
